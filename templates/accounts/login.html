<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
</head>
<body>

    <h2>Sign In</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign In</button>
    </form>

    <hr>
    <!-- Змінено 'register' на 'registration' відповідно до вашого urls.py -->
    <p>Don't have an account yet? <a href="{% url 'registration' %}">Register here</a></p>
    <p>Back to <a href="/">Home</a></p>

</body>
</html>
