<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>

    <h2>Create an Account</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>

    <hr>
    <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    <p>Back to <a href="/">Home</a></p>

</body>
</html>
